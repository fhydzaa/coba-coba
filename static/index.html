<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Battery RUL Prediction</title>

    <!-- SheetJS -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 40px auto;
            padding: 20px;
            background: #f7f8fa;
            color: #222;
        }

        h1 {
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 25px;
        }

        .card {
            background: white;
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        input[type="file"] {
            margin: 10px 0;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #222;
            color: white;
            font-size: 14px;
        }

        button:hover {
            opacity: 0.85;
        }

        #status {
            margin-top: 15px;
        }

        .success {
            color: #087f23;
            font-weight: bold;
        }

        .error {
            color: #b00020;
            font-weight: bold;
        }

        /* =====================================================
           PREVIEW TABLE
        ===================================================== */

        .table-container {
            overflow-x: auto;
            margin-top: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1000px;
            font-size: 13px;
        }

        th,
        td {
            border-bottom: 1px solid #ddd;
            padding: 8px 10px;
            text-align: left;
            white-space: nowrap;
        }

        th {
            background: #f1f3f5;
            font-weight: bold;
        }

        tr:hover {
            background: #fafafa;
        }

        /* =====================================================
           RESULT
        ===================================================== */

        .result-grid {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .result-box {
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 25px;
            text-align: center;
        }

        .result-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .result-value {
            font-size: 38px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .result-unit {
            color: #666;
        }

        .difference-box {
            margin-top: 20px;
            padding: 18px;
            border-radius: 10px;
            background: #f1f3f5;
            text-align: center;
            font-size: 16px;
        }

        .difference-value {
            font-size: 26px;
            font-weight: bold;
            margin-top: 8px;
        }

        /* =====================================================
           ACTUAL RUL
        ===================================================== */

        .actual-box {
            margin-top: 20px;
            padding: 18px;
            border: 1px solid #ddd;
            border-radius: 10px;
            text-align: center;
        }

        .actual-value {
            font-size: 28px;
            font-weight: bold;
            margin-top: 8px;
        }

        /* =====================================================
           RESPONSIVE
        ===================================================== */

        @media (max-width: 600px) {

            body {
                margin: 15px;
                padding: 10px;
            }

            .result-value {
                font-size: 30px;
            }

        }

    </style>
</head>


<body>

    <h1>Battery RUL Prediction</h1>

    <p class="subtitle">
        Upload file Excel yang berisi minimal 10 cycle
        dan 25 feature model.
    </p>


    <!-- =====================================================
         UPLOAD
    ====================================================== -->

    <div class="card">

        <h3>Upload Data</h3>

        <input
            type="file"
            id="excelFile"
            accept=".xlsx,.xls"
        >

        <br><br>

        <button onclick="processExcel()">
            Prediksi RUL
        </button>

        <p id="status"></p>

    </div>


    <!-- =====================================================
         PREVIEW
    ====================================================== -->

    <div
        id="preview"
        class="card"
        style="display:none;"
    ></div>


    <!-- =====================================================
         RESULT
    ====================================================== -->

    <div
        id="result"
        class="card"
        style="display:none;"
    ></div>


<script>

/* ============================================================
   RENDER PREVIEW TABLE
============================================================ */

function renderPreview(data) {

    const preview =
        document.getElementById("preview");

    preview.style.display = "block";


    if (!data || data.length === 0) {

        preview.innerHTML = `
            <h3>Preview Data</h3>
            <p>Data kosong.</p>
        `;

        return;
    }


    const columns =
        Object.keys(data[0]);


    const rows =
        data.slice(0, 5);


    let html = `

        <h3>Preview Data</h3>

        <p>
            Jumlah baris:
            <b>${data.length}</b>
        </p>

        <p>
            Menampilkan 5 baris pertama.
        </p>

        <div class="table-container">

            <table>

                <thead>

                    <tr>
    `;


    columns.forEach(column => {

        html += `
            <th>${column}</th>
        `;

    });


    html += `
                    </tr>

                </thead>

                <tbody>
    `;


    rows.forEach(row => {

        html += `<tr>`;


        columns.forEach(column => {

            const value =
                row[column] ?? "";

            html += `
                <td>${value}</td>
            `;

        });


        html += `</tr>`;

    });


    html += `

                </tbody>

            </table>

        </div>
    `;


    preview.innerHTML = html;
}


/* ============================================================
   PROCESS EXCEL
============================================================ */

async function processExcel() {

    const fileInput =
        document.getElementById("excelFile");

    const status =
        document.getElementById("status");

    const result =
        document.getElementById("result");


    /* ========================================================
       VALIDASI FILE
    ======================================================== */

    if (!fileInput.files.length) {

        status.innerHTML =
            `
            <span class="error">
                Pilih file Excel terlebih dahulu.
            </span>
            `;

        return;
    }


    const file =
        fileInput.files[0];


    status.textContent =
        "Membaca file...";


    result.style.display =
        "none";


    try {

        /* ====================================================
           1. BACA FILE
        ==================================================== */

        const buffer =
            await file.arrayBuffer();


        /* ====================================================
           2. BACA WORKBOOK
        ==================================================== */

        const workbook =
            XLSX.read(
                buffer,
                {
                    type: "array"
                }
            );


        /* ====================================================
           3. SHEET PERTAMA
        ==================================================== */

        const firstSheet =
            workbook.Sheets[
                workbook.SheetNames[0]
            ];


        /* ====================================================
           4. EXCEL → JSON
        ==================================================== */

        const data =
            XLSX.utils.sheet_to_json(
                firstSheet,
                {
                    defval: null
                }
            );


        console.log(
            "Jumlah data:",
            data.length
        );

        console.log(
            "Data pertama:",
            data[0]
        );


        /* ====================================================
           5. VALIDASI JUMLAH DATA
        ==================================================== */

        if (data.length < 10) {

            throw new Error(
                "File harus memiliki minimal 10 cycle."
            );
        }


        /* ====================================================
           6. PREVIEW
        ==================================================== */

        renderPreview(data);


        /* ====================================================
           7. KIRIM KE API
        ==================================================== */

        status.textContent =
            "Mengirim data ke model...";


        const response =
            await fetch(
                "/predict",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        data: data
                    })
                }
            );


        /* ====================================================
           8. RESPONSE
        ==================================================== */

        const responseData =
            await response.json();


        console.log(
            "HTTP status:",
            response.status
        );

        console.log(
            "Response API:",
            responseData
        );


        /* ====================================================
           9. ERROR API
        ==================================================== */

        if (!response.ok) {

            const detail =
                responseData.detail;

            let message;

            if (typeof detail === "string") {

                message = detail;

            } else {

                message =
                    JSON.stringify(
                        detail,
                        null,
                        2
                    );
            }


            throw new Error(
                message ||
                "Prediction gagal."
            );
        }


        /* ====================================================
           10. HASIL PREDIKSI
        ==================================================== */

        result.style.display =
            "block";


        let actualRulHtml = "";


        /*
         * Kalau API nanti mengembalikan actual_rul,
         * tampilkan juga.
         */

        if (
            responseData.actual_rul !== undefined
        ) {

            actualRulHtml = `

                <div class="actual-box">

                    <div>
                        Actual RUL
                    </div>

                    <div class="actual-value">

                        ${Number(
                            responseData.actual_rul
                        ).toFixed(2)}

                    </div>

                    <div class="result-unit">
                        cycles
                    </div>

                </div>

            `;
        }


        result.innerHTML = `

            <h3>Hasil Prediksi</h3>


            <div class="result-grid">


                <!-- KAN -->

                <div class="result-box">

                    <div class="result-title">
                        KAN RUL
                    </div>

                    <div class="result-value">

                        ${Number(
                            responseData.kan_rul
                        ).toFixed(2)}

                    </div>

                    <div class="result-unit">
                        cycles
                    </div>

                </div>


                <!-- SYMBOLIC -->

                <div class="result-box">

                    <div class="result-title">
                        Symbolic RUL
                    </div>

                    <div class="result-value">

                        ${Number(
                            responseData.symbolic_rul
                        ).toFixed(2)}

                    </div>

                    <div class="result-unit">
                        cycles
                    </div>

                </div>


            </div>


            <!-- DIFFERENCE -->

            <div class="difference-box">

                <div>
                    Selisih KAN vs Symbolic
                </div>

                <div class="difference-value">

                    ${Number(
                        responseData.difference
                    ).toFixed(2)}

                    cycles

                </div>

            </div>


            ${actualRulHtml}

        `;


        /* ====================================================
           11. STATUS SUKSES
        ==================================================== */

        status.innerHTML =
            `
            <span class="success">
                Prediksi berhasil.
            </span>
            `;


    }


    catch (error) {

        console.error(
            "Error:",
            error
        );


        status.innerHTML =
            `
            <span class="error">
                ${error.message}
            </span>
            `;


        result.style.display =
            "none";
    }

}

</script>

</body>

</html>
